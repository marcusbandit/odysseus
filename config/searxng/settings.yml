use_default_settings: true

server:
  secret_key: "__SEARXNG_SECRET__"

search:
  # Search-box query suggestions. Proxied through this SearXNG server to the
  # chosen provider (the browser never talks to it directly). autocomplete_min
  # = chars typed before suggestions fire. Google gives the best suggestions;
  # switch back to "duckduckgo" if Google ever rate-limits this instance.
  autocomplete: "google"
  autocomplete_min: 2
  # Site favicons next to results, like Google. Proxied and cached server
  # side (/tmp/faviconcache.db in the container, 30 days).
  favicon_resolver: "duckduckgo"
  formats:
    - html
    - json

ui:
  # Google-style centered results column instead of left-hugging.
  center_alignment: true
  # j/k result navigation and friends (overridable per user in preferences).
  hotkeys: vim

# The caelestia look itself lives in two bind mounts (see docker-compose.yml):
# a patched templates/simple/base.html that links two extra stylesheets, and
# the static custom/ dir holding caelestia.css (hand written) + scheme.css
# (generated from the desktop colour scheme by gen-scheme-css.sh, auto-run on
# scheme changes by the systemd user unit searxng-caelestia-theme.path).

# NOTE: unlike `engines` (merged by name), a `plugins:` section REPLACES the
# default plugin map wholesale (searx/settings_loader.py, update_settings), so
# every default plugin we want active must be restated here. The values below
# mirror the image defaults for searxng 2026.5.31; only currency_answer is
# custom.
plugins:
  # Custom: Google-style currency instant answers ("400 usd" -> DKK card,
  # also "$400", "400 kr", "400 usd in eur"). Module is bind mounted at
  # searx/plugins/currency_answer.py (see docker-compose.yml). It replaces
  # the built-in `currency` engine (disabled below), which only understood
  # the "X usd to Y" form and is silently killed by a searx.data cache
  # expiry bug after 7 days of uptime.
  searx.plugins.cael.currency_answer.SXNGPlugin:
    active: true

  # Custom: Google-style weather card ("weather copenhagen", "vejret lyngby",
  # bare "weather" defaults to Copenhagen). Bind mounted like currency_answer.
  searx.plugins.cael.weather_answer.SXNGPlugin:
    active: true

  # Custom: server-side calculator ("2+2*3", "sqrt(2)*100", "15% of 340",
  # "0xff in decimal"). Replaces the stock client-JS calculator (disabled
  # below) so results also appear in format=json.
  searx.plugins.cael.calc_answer.SXNGPlugin:
    active: true

  # Custom: dictionary card ("define serendipity", "meaning of ephemeral").
  searx.plugins.cael.define_answer.SXNGPlugin:
    active: true

  # Custom: color swatch card ("#c9bfff", "rgb(201, 191, 255)", "farve f9b1dc").
  searx.plugins.cael.color_answer.SXNGPlugin:
    active: true

  # Custom: stock quote card with sparkline ("aapl stock", "$NVDA").
  searx.plugins.cael.stock_answer.SXNGPlugin:
    active: true

  # Image defaults below (restated because this map does not merge).
  # The stock searx.plugins.calculator.SXNGPlugin is deliberately OMITTED
  # (not just inactive): it is client-JS only in this version and omission
  # removes it from preferences entirely, so it can never be cookie
  # re-enabled to double up with cael.calc_answer above.
  # "md5 foo", "sha256 foo", ...
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  # "ip", "user-agent"
  searx.plugins.self_info.SXNGPlugin:
    active: true
  # "100 cm in m", "5 km in miles", ...
  searx.plugins.unit_converter.SXNGPlugin:
    active: true
  # "time berlin", "now tokyo", ...
  searx.plugins.time_zone.SXNGPlugin:
    active: true
  searx.plugins.ahmia_filter.SXNGPlugin:
    active: true
  searx.plugins.hostnames.SXNGPlugin:
    active: true
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true
  # Changed from image default (false): auto-load the next page on scroll,
  # Google-continuous-results style.
  searx.plugins.infinite_scroll.SXNGPlugin:
    active: true
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: false
  searx.plugins.tor_check.SXNGPlugin:
    active: false

# Custom engines are MERGED into SearXNG's defaults by `name` (because
# use_default_settings is true): a new name is appended, a known name has its
# keys updated into the built-in definition, it does not replace the list.
engines:
  # `!gm` -> one result that links to the REAL Google Maps
  # (https://maps.google.com/maps?q=<query>). Implemented by the offline
  # engine module mounted at searx/engines/google_maps.py (see the bind
  # mount in docker-compose.yml).
  #
  # `disabled: false` overrides the module's default (it ships disabled)
  # so it ALSO runs on every Map-tab search, not just via `!gm`.
  # `weight: 100` pins its "Open in Google Maps" result to the TOP: result
  # score == engine weight (searx/results.py), and OpenStreetMap places
  # only reach ~1-3, so 100 always wins. The `!gm` bang still works too.
  - name: google maps
    engine: google_maps
    shortcut: gm
    categories: [map]
    disabled: false
    weight: 100

  # Built-in "400 usd to eur" converter, superseded by the currency_answer
  # plugin above (which also handles bare "400 usd" and does not depend on
  # the expiring searx.data cache). The `!cc` bang still reaches it.
  - name: currency
    disabled: true

  # Google-parity instant definitions on the general tab (DuckDuckGo's
  # instant-answer API; low weight, only fires on definition-ish queries).
  - name: ddg definitions
    disabled: false

  # Weather via Open-Meteo: `!om copenhagen` or the weather category.
  - name: openmeteo
    disabled: false

  # Dev-tab engines, off by default upstream: `!npm`, `!crates` and on the
  # it category. (No aur engine exists in 2026.5.31; archwiki/pypi/docker
  # hub/github are already enabled upstream.)
  - name: npm
    disabled: false
  - name: crates.io
    disabled: false
